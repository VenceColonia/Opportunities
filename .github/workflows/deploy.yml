name: Deploy dashboard

# Rebuilds the static export and deploys it to GitHub Pages — free hosting,
# no server. Runs on every push to main (including the pipeline bot's data
# commits) so the dashboard reflects the latest pipeline run within one
# deploy cycle. See ARCHITECTURE.md §9 for what "realtime" means here.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build static export
        # GitHub Pages project sites (the default here, since we're not on
        # a custom domain or a <user>.github.io root repo) serve from
        # /<repo-name>/, not /. Without this, the static export's asset
        # paths and internal links would all be wrong under that subpath.
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
